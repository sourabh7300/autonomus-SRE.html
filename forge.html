<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Forge</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<style>
  :root{
    --bg:#0A0C0F;
    --panel:#12151A;
    --panel-alt:#171B21;
    --border:#262B33;
    --text:#E7EAEE;
    --text-dim:#7C848F;
    --accent:#F2A93B;
    --accent-dim:#7A5B23;
    --accent-soft:rgba(242,169,59,0.12);
    --success:#5FD99B;
    --success-soft:rgba(95,217,155,0.14);
    --danger:#E15554;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    height:100vh;
    overflow:hidden;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
  }
  .brand .mark{
    width:9px;height:9px;border-radius:2px;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    transform:rotate(45deg);
  }
  .brand .name{color:var(--text);}
  .brand .tagline{
    color:var(--text-dim);
    font-size:12px;
    font-weight:400;
    margin-left:4px;
    padding-left:12px;
    border-left:1px solid var(--border);
  }
  header .spacer{flex:1;}
  select, .btn{
    font-family:var(--font-ui);
    font-size:13px;
    background:var(--panel-alt);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  select:hover, .btn:hover{border-color:#3a4150;}
  select:focus, .btn:focus{outline:2px solid var(--accent-dim); outline-offset:1px;}
  .btn-ghost{background:transparent;}
  .btn-primary{
    background:var(--accent);
    color:#1A1204;
    border:1px solid var(--accent);
    font-weight:600;
  }
  .btn-primary:hover{background:#ffb95a;}
  .btn-primary:disabled{opacity:0.5; cursor:not-allowed;}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  /* ---------- Main layout ---------- */
  main{
    flex:1;
    display:grid;
    grid-template-columns:1fr 380px;
    min-height:0;
  }
  .editor-pane{
    display:flex;
    flex-direction:column;
    min-height:0;
    border-right:1px solid var(--border);
  }
  .editor-toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    font-size:12px;
    color:var(--text-dim);
  }
  .filename{
    color:var(--text);
    font-family:var(--font-mono);
    font-size:12.5px;
  }
  .dot-unsaved{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    display:none;
  }
  .cm-wrap{flex:1; min-height:0; position:relative;}
  .CodeMirror{
    height:100%;
    font-family:var(--font-mono);
    font-size:13.5px;
    line-height:1.6;
    background:var(--bg) !important;
    color:var(--text) !important;
  }
  .CodeMirror-gutters{
    background:var(--bg) !important;
    border-right:1px solid var(--border) !important;
  }
  .CodeMirror-linenumber{color:#3d4451 !important;}
  .CodeMirror-cursor{border-left:2px solid var(--accent) !important;}
  .CodeMirror-selected{background:rgba(242,169,59,0.13) !important;}
  .cm-keyword{color:#c792ea !important;}
  .cm-string{color:#a3d97a !important;}
  .cm-comment{color:#5c6472 !important; font-style:italic;}
  .cm-number{color:#f2a93b !important;}
  .cm-def, .cm-variable-2{color:#7ec3f0 !important;}
  .cm-atom{color:#f2a93b !important;}
  .cm-property{color:#7ec3f0 !important;}
  .cm-tag{color:#e2777a !important;}
  .cm-attribute{color:#c792ea !important;}

  .ember-flash-line{
    animation: cool 1.6s ease-out forwards;
  }
  @keyframes cool{
    0%{background:rgba(242,169,59,0.35);}
    100%{background:rgba(242,169,59,0);}
  }

  /* ---------- AI panel ---------- */
  .ai-pane{
    display:flex;
    flex-direction:column;
    background:var(--panel);
    min-height:0;
  }
  .ai-header{
    padding:12px 16px 10px;
    border-bottom:1px solid var(--border);
  }
  .ai-header h2{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin:0 0 2px;
    font-weight:600;
  }
  .ai-header p{
    margin:0;
    font-size:11.5px;
    color:#565d68;
  }
  .mode-toggle{
    display:flex;
    gap:6px;
    padding:10px 16px 0;
  }
  .mode-btn{
    flex:1;
    text-align:center;
    padding:7px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    font-family:var(--font-ui);
  }
  .mode-btn.active{
    border-color:var(--accent-dim);
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:600;
  }
  .ai-body{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:14px 16px;
    gap:10px;
    min-height:0;
  }
  textarea#instruction{
    width:100%;
    resize:none;
    height:64px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    padding:10px;
    line-height:1.4;
  }
  textarea#instruction:focus{outline:none; border-color:var(--accent-dim);}
  .hint{
    font-size:11px;
    color:#565d68;
  }
  .hint kbd{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:3px;
    padding:1px 5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-dim);
  }
  .generate-row{display:flex; gap:8px;}
  .generate-row .btn-primary{flex:1;}

  .status-line{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--text-dim);
    min-height:18px;
  }
  .ember-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 6px var(--accent);
    animation:pulse 1s ease-in-out infinite;
    display:none;
  }
  @keyframes pulse{
    0%,100%{opacity:0.35; transform:scale(0.85);}
    50%{opacity:1; transform:scale(1.1);}
  }
  .status-line.active .ember-dot{display:inline-block;}
  .status-line.error{color:var(--danger);}

  .preview-wrap{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    background:var(--bg);
  }
  .preview-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 10px;
    background:var(--panel-alt);
    border-bottom:1px solid var(--border);
    font-size:11px;
    color:var(--text-dim);
  }
  .preview-actions{display:flex; gap:6px;}
  .preview-actions .btn{padding:5px 10px; font-size:11.5px;}
  pre#preview{
    flex:1;
    margin:0;
    padding:12px;
    overflow:auto;
    font-family:var(--font-mono);
    font-size:12.5px;
    line-height:1.55;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .preview-empty{
    color:#4b5260;
    font-style:italic;
    font-size:12px;
    padding:14px;
  }
  .cursor-blink{
    display:inline-block;
    width:6px;height:13px;
    background:var(--accent);
    margin-left:1px;
    animation:blink 0.9s steps(1) infinite;
    vertical-align:middle;
  }
  @keyframes blink{50%{opacity:0;}}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#232830; border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#2d3440;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <span class="name">Forge</span>
      <span class="tagline">Write the skeleton. Forge the rest.</span>
    </div>
    <div class="spacer"></div>
    <select id="language">
      <option value="javascript" data-mime="text/javascript">JavaScript</option>
      <option value="typescript" data-mime="text/typescript">TypeScript</option>
      <option value="python" data-mime="text/x-python">Python</option>
      <option value="htmlmixed" data-mime="text/html">HTML</option>
      <option value="clike" data-mime="text/x-java">Java</option>
      <option value="clike-cpp" data-mime="text/x-c++src">C++</option>
    </select>
    <button class="btn btn-ghost" id="clearBtn" title="Clear editor">Clear</button>
    <button class="btn btn-ghost" id="downloadBtn" title="Download file">Download</button>
  </header>

  <main>
    <div class="editor-pane">
      <div class="editor-toolbar">
        <span class="dot-unsaved" id="unsavedDot"></span>
        <span class="filename" id="filenameLabel">untitled.js</span>
        <span style="flex:1"></span>
        <span id="charCount">0 chars</span>
      </div>
      <div class="cm-wrap">
        <textarea id="editor"></textarea>
      </div>
    </div>

    <div class="ai-pane">
      <div class="ai-header">
        <h2>AI Assist</h2>
        <p>Describe what you need. Forge writes it.</p>
      </div>

      <div class="mode-toggle">
        <div class="mode-btn active" data-mode="insert">Insert at cursor</div>
        <div class="mode-btn" data-mode="replace">Rewrite file</div>
      </div>

      <div class="ai-body">
        <textarea id="instruction" placeholder="e.g. write a function that reverses a linked list"></textarea>
        <div class="hint">Tip: place your cursor in the editor first, then press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to generate.</div>
        <div class="generate-row">
          <button class="btn btn-primary" id="generateBtn">Generate</button>
        </div>
        <div class="status-line" id="statusLine">
          <span class="ember-dot"></span>
          <span id="statusText"></span>
        </div>

        <div class="preview-wrap">
          <div class="preview-header">
            <span>Output</span>
            <div class="preview-actions">
              <button class="btn" id="insertBtn" disabled>Insert</button>
              <button class="btn" id="replaceBtn" disabled>Replace all</button>
            </div>
          </div>
          <pre id="preview"><span class="preview-empty">Generated code will appear here.</span></pre>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

<script>
(function(){
  const STARTER = {
    javascript: "// Start typing, or ask Forge to generate something.\nfunction greet(name) {\n  return \`Hello, \${name}!\`;\n}\n",
    typescript: "// Start typing, or ask Forge to generate something.\nfunction greet(name: string): string {\n  return \`Hello, \${name}!\`;\n}\n",
    python: "# Start typing, or ask Forge to generate something.\ndef greet(name):\n    return f\"Hello, {name}!\"\n",
    htmlmixed: "<!-- Start typing, or ask Forge to generate something. -->\n<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>\n",
    clike: "// Start typing, or ask Forge to generate something.\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n    }\n}\n",
    "clike-cpp": "// Start typing, or ask Forge to generate something.\n#include <iostream>\nint main() {\n    std::cout << \"Hello\" << std::endl;\n    return 0;\n}\n"
  };

  const EXT = {
    javascript:"js", typescript:"ts", python:"py", htmlmixed:"html", clike:"java", "clike-cpp":"cpp"
  };

  const langSelect = document.getElementById('language');
  const filenameLabel = document.getElementById('filenameLabel');
  const charCount = document.getElementById('charCount');
  const unsavedDot = document.getElementById('unsavedDot');
  const instructionEl = document.getElementById('instruction');
  const generateBtn = document.getElementById('generateBtn');
  const insertBtn = document.getElementById('insertBtn');
  const replaceBtn = document.getElementById('replaceBtn');
  const previewEl = document.getElementById('preview');
  const statusLine = document.getElementById('statusLine');
  const statusText = document.getElementById('statusText');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const modeButtons = document.querySelectorAll('.mode-btn');

  let mode = 'insert';
  let lastGenerated = '';
  let generating = false;

  function getMime(){
    const opt = langSelect.selectedOptions[0];
    return opt.getAttribute('data-mime');
  }

  const cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
    mode: getMime(),
    lineNumbers: true,
    theme: 'default',
    tabSize: 2,
    indentUnit: 2,
    viewportMargin: Infinity,
    extraKeys: {
      "Ctrl-Enter": function(){ generate(); },
      "Cmd-Enter": function(){ generate(); }
    }
  });

  cm.setValue(STARTER[langSelect.value]);

  function updateFilename(){
    const ext = EXT[langSelect.value];
    filenameLabel.textContent = 'untitled.' + ext;
  }
  updateFilename();

  function updateCharCount(){
    charCount.textContent = cm.getValue().length + ' chars';
  }
  updateCharCount();

  cm.on('change', function(){
    updateCharCount();
    unsavedDot.style.display = 'inline-block';
  });

  langSelect.addEventListener('change', function(){
    cm.setOption('mode', getMime());
    updateFilename();
    if (!cm.getValue().trim()){
      cm.setValue(STARTER[langSelect.value] || '');
    }
  });

  clearBtn.addEventListener('click', function(){
    cm.setValue('');
    cm.focus();
  });

  downloadBtn.addEventListener('click', function(){
    const blob = new Blob([cm.getValue()], {type:'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filenameLabel.textContent;
    a.click();
    URL.revokeObjectURL(url);
  });

  modeButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      modeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.getAttribute('data-mode');
    });
  });

  function setStatus(text, active, isError){
    statusText.textContent = text || '';
    statusLine.classList.toggle('active', !!active);
    statusLine.classList.toggle('error', !!isError);
  }

  function setPreview(code){
    if (!code){
      previewEl.innerHTML = '<span class="preview-empty">Generated code will appear here.</span>';
      insertBtn.disabled = true;
      replaceBtn.disabled = true;
      return;
    }
    previewEl.textContent = code;
    insertBtn.disabled = false;
    replaceBtn.disabled = false;
  }

  function stripFences(text){
    let t = text.trim();
    const fenceMatch = t.match(/^```[a-zA-Z0-9]*\n([\s\S]*?)\n```$/);
    if (fenceMatch) return fenceMatch[1];
    return t;
  }

  async function generate(){
    if (generating) return;
    const instruction = instructionEl.value.trim();
    if (!instruction){
      setStatus('Type an instruction first.', false, true);
      instructionEl.focus();
      return;
    }
    generating = true;
    generateBtn.disabled = true;
    setPreview('');
    previewEl.innerHTML = '<span class="preview-empty">Forging<span class="cursor-blink"></span></span>';
    setStatus('Forging your code…', true, false);

    const langLabel = langSelect.selectedOptions[0].textContent;
    const fullCode = cm.getValue();
    const cursor = cm.getCursor();
    const cursorIndex = cm.indexFromPos(cursor);
    const before = fullCode.slice(0, cursorIndex);
    const after = fullCode.slice(cursorIndex);

    let userContent;
    let systemPrompt = "You are Forge, an expert pair-programming assistant embedded inside a code editor. " +
      "The user is writing " + langLabel + " code. " +
      "Output ONLY code. No explanations, no commentary, no markdown code fences, no backticks — raw code only, ready to drop directly into a file.";

    if (mode === 'insert'){
      userContent = "Here is the code before the cursor:\n" + before +
        "\n\n--- CURSOR IS HERE ---\n\nHere is the code after the cursor:\n" + after +
        "\n\nInstruction: " + instruction +
        "\n\nGenerate ONLY the code snippet that should be inserted at the cursor position to fulfill the instruction. Do not repeat the surrounding code.";
    } else {
      userContent = "Here is the current file content:\n" + fullCode +
        "\n\nInstruction: " + instruction +
        "\n\nRewrite the ENTIRE file to fulfill the instruction, keeping anything from the original that still makes sense. Output the full new file content.";
    }

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1500,
          system: systemPrompt,
          messages: [{ role: "user", content: userContent }]
        })
      });

      if (!response.ok){
        throw new Error("Request failed (" + response.status + ")");
      }
      const data = await response.json();
      const text = (data.content || [])
        .map(function(block){ return block.type === 'text' ? block.text : ''; })
        .filter(Boolean)
        .join('\n');

      const code = stripFences(text);
      lastGenerated = code;
      setPreview(code);
      setStatus('Ready — review and insert or replace.', false, false);
    } catch (err) {
      console.error(err);
      setPreview('');
      setStatus('Something went wrong: ' + err.message, false, true);
    } finally {
      generating = false;
      generateBtn.disabled = false;
    }
  }

  function flashLines(fromLine, toLine){
    for (let i = fromLine; i <= toLine; i++){
      cm.addLineClass(i, 'background', 'ember-flash-line');
    }
    setTimeout(function(){
      for (let i = fromLine; i <= toLine; i++){
        cm.removeLineClass(i, 'background', 'ember-flash-line');
      }
    }, 1600);
  }

  insertBtn.addEventListener('click', function(){
    if (!lastGenerated) return;
    const cursor = cm.getCursor();
    const fromLine = cursor.line;
    cm.replaceRange(lastGenerated, cursor);
    const toLine = fromLine + lastGenerated.split('\n').length - 1;
    flashLines(fromLine, toLine);
    cm.focus();
  });

  replaceBtn.addEventListener('click', function(){
    if (!lastGenerated) return;
    cm.setValue(lastGenerated);
    flashLines(0, cm.lineCount() - 1);
  });

  generateBtn.addEventListener('click', generate);
  instructionEl.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      generate();
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sourabh AI</title>
<style>
  :root{
    --bg:#0E0F13;
    --panel:#16181D;
    --panel-alt:#1C1F26;
    --border:#2A2E37;
    --text:#EDEFF3;
    --text-dim:#8A8F99;
    --accent:#7C5CFF;
    --accent-dim:#5A3FD6;
    --accent-soft:rgba(124,92,255,0.14);
    --user-bubble:#2A2740;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-ui);
    height:100vh; overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  header{
    display:flex; align-items:center; gap:12px;
    padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .logo{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg, var(--accent), #B79CFF);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:white; flex-shrink:0;
  }
  .brand-name{font-weight:800; font-size:15.5px; letter-spacing:-0.01em;}
  .brand-sub{font-size:11.5px; color:var(--text-dim);}
  header .spacer{flex:1;}
  .new-chat-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text-dim);
    background:var(--panel-alt); border:1px solid var(--border); border-radius:7px;
    padding:7px 12px; cursor:pointer;
  }
  .new-chat-btn:hover{color:var(--text); border-color:#3a3f4b;}

  main{
    flex:1; overflow-y:auto; padding:24px 0 10px;
  }
  .thread{max-width:680px; margin:0 auto; padding:0 20px;}

  .msg{display:flex; gap:12px; margin-bottom:22px; align-items:flex-start;}
  .msg.user{flex-direction:row-reverse;}
  .avatar{
    width:30px;height:30px;border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
  }
  .avatar.assistant{background:linear-gradient(135deg, var(--accent), #B79CFF); color:white;}
  .avatar.user{background:var(--user-bubble); color:#C9BFFF;}
  .bubble{
    max-width:78%; padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word;
  }
  .msg.assistant .bubble{background:var(--panel-alt); border:1px solid var(--border); border-top-left-radius:4px;}
  .msg.user .bubble{background:var(--user-bubble); border-top-right-radius:4px;}

  .typing{display:flex; gap:4px; padding:6px 4px;}
  .typing span{
    width:6px;height:6px;border-radius:50%; background:var(--text-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:0.4;} 30%{transform:translateY(-4px); opacity:1;}}

  .empty-state{
    max-width:520px; margin:8vh auto 0; text-align:center; padding:0 20px;
  }
  .empty-state .logo{width:52px; height:52px; border-radius:16px; margin:0 auto 18px; font-size:22px;}
  .empty-state h1{font-size:22px; font-weight:800; margin:0 0 8px; letter-spacing:-0.01em;}
  .empty-state p{font-size:14px; color:var(--text-dim); margin:0 0 24px;}
  .suggestions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .suggestion{
    text-align:left; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel-alt); font-size:13px; color:var(--text-dim); cursor:pointer;
  }
  .suggestion:hover{border-color:var(--accent-dim); color:var(--text);}

  footer{
    flex-shrink:0; padding:14px 20px 20px; background:var(--bg);
  }
  .input-wrap{
    max-width:680px; margin:0 auto;
    display:flex; align-items:flex-end; gap:10px;
    background:var(--panel-alt); border:1px solid var(--border); border-radius:16px;
    padding:8px 8px 8px 16px;
  }
  .input-wrap:focus-within{border-color:var(--accent-dim);}
  textarea#composer{
    flex:1; resize:none; border:none; outline:none; background:transparent;
    color:var(--text); font-family:inherit; font-size:14.5px; line-height:1.5;
    max-height:160px; padding:8px 0;
  }
  textarea#composer::placeholder{color:var(--text-dim);}
  #sendBtn{
    width:36px;height:36px; border-radius:10px; border:none; cursor:pointer; flex-shrink:0;
    background:var(--accent); color:white; display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled{opacity:0.35; cursor:not-allowed;}
  .footnote{text-align:center; font-size:11px; color:#4d525d; margin-top:10px;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:#232730; border-radius:5px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">S</div>
    <div>
      <div class="brand-name">Sourabh AI</div>
      <div class="brand-sub">Created by Sourabh Singh</div>
    </div>
    <div class="spacer"></div>
    <button class="new-chat-btn" id="newChatBtn">New chat</button>
  </header>

  <main id="main">
    <div class="thread" id="thread"></div>
  </main>

  <footer>
    <div class="input-wrap">
      <textarea id="composer" rows="1" placeholder="Message Sourabh AI…"></textarea>
      <button id="sendBtn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="white"/></svg>
      </button>
    </div>
    <div class="footnote">Sourabh AI can make mistakes. Check important info.</div>
  </footer>
</div>

<script>
(function(){
  const thread = document.getElementById('thread');
  const main = document.getElementById('main');
  const composer = document.getElementById('composer');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');

  let history = []; // {role, content}
  let generating = false;

  const SUGGESTIONS = [
    "Explain a topic simply",
    "Help me write an email",
    "Brainstorm ideas for a project",
    "Debug a piece of code"
  ];

  function renderEmptyState(){
    thread.innerHTML = `
      <div class="empty-state">
        <div class="logo">S</div>
        <h1>Sourabh AI</h1>
        <p>Ask anything — I'm here to help.</p>
        <div class="suggestions">
          ${SUGGESTIONS.map(s => `<div class="suggestion">${s}</div>`).join('')}
        </div>
      </div>
    `;
    thread.querySelectorAll('.suggestion').forEach(el => {
      el.addEventListener('click', () => {
        composer.value = el.textContent;
        composer.focus();
        autoGrow();
      });
    });
  }

  function scrollToBottom(){
    main.scrollTop = main.scrollHeight;
  }

  function renderMessages(){
    if (history.length === 0){
      renderEmptyState();
      return;
    }
    thread.innerHTML = history.map(m => `
      <div class="msg ${m.role}">
        <div class="avatar ${m.role}">${m.role === 'user' ? 'You' : 'S'}</div>
        <div class="bubble">${escapeHtml(m.content)}</div>
      </div>
    `).join('');
    scrollToBottom();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function addTypingIndicator(){
    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.id = 'typingIndicator';
    el.innerHTML = `
      <div class="avatar assistant">S</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    thread.appendChild(el);
    scrollToBottom();
  }

  function removeTypingIndicator(){
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function autoGrow(){
    composer.style.height = 'auto';
    composer.style.height = Math.min(composer.scrollHeight, 160) + 'px';
  }
  composer.addEventListener('input', autoGrow);

  async function sendMessage(){
    const text = composer.value.trim();
    if (!text || generating) return;

    history.push({ role:'user', content:text });
    composer.value = '';
    autoGrow();
    renderMessages();
    addTypingIndicator();

    generating = true;
    sendBtn.disabled = true;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1024,
          system:"You are Sourabh AI, a helpful, friendly assistant created by Sourabh Singh. Be clear, concise, and warm.",
          messages: history.map(m => ({ role: m.role, content: m.content }))
        })
      });
      if (!response.ok) throw new Error("Request failed (" + response.status + ")");
      const data = await response.json();
      const replyText = (data.content || []).map(b => b.type === 'text' ? b.text : '').filter(Boolean).join('\n').trim();

      removeTypingIndicator();
      history.push({ role:'assistant', content: replyText || "Sorry, I couldn't generate a response." });
      renderMessages();
    } catch(err){
      removeTypingIndicator();
      history.push({ role:'assistant', content: "Something went wrong: " + err.message });
      renderMessages();
    } finally {
      generating = false;
      sendBtn.disabled = false;
      composer.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  composer.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });

  newChatBtn.addEventListener('click', () => {
    history = [];
    renderMessages();
    composer.focus();
  });

  renderEmptyState();
})();
</script>
</body>
</html>

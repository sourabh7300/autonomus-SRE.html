<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>task-tracker — CloudNative Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #2a323c;
    --text: #d8dee9;
    --text-dim: #6e7681;
    --accent: #58a6ff;
    --amber: #d29922;
    --blue: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 620px; }

  .termbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #1c232c;
    border: 1px solid var(--border);
    border-radius: 8px 8px 0 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.r { background: #f85149; }
  .dot.y { background: #d29922; }
  .dot.g { background: #3fb950; }
  .termbar span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 8px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 24px;
  }

  .prompt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green);
    margin-bottom: 4px;
  }
  .prompt::before { content: "$ "; color: var(--text-dim); }
  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--text-dim); }

  button {
    background: var(--accent);
    color: #04101f;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button:hover { background: #79b8ff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #task-list { list-style: none; }
  .task-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    background: #10151c;
  }
  .task-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .task-title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    text-transform: lowercase;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-pending { background: rgba(210,153,34,0.12); color: var(--amber); }
  .status-pending .status-dot { background: var(--amber); }
  .status-processing { background: rgba(88,166,255,0.12); color: var(--blue); }
  .status-processing .status-dot { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  .status-done { background: rgba(63,185,80,0.12); color: var(--green); }
  .status-done .status-dot { background: var(--green); }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  }

  .delete-btn {
    background: none;
    color: var(--text-dim);
    padding: 2px 6px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1;
  }
  .delete-btn:hover { color: var(--red); background: none; }

  .empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
  }

  .footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  @media (max-width: 480px) {
    .task-title { max-width: 140px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="termbar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span>task-worker@cloudnative-platform</span>
  </div>
  <div class="panel">
    <div class="prompt">kubectl get tasks --watch</div>
    <h1>task-tracker</h1>
    <p class="subtitle">In-browser demo — a worker simulates moving each task from pending to done, just like the real worker service does against the API.</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Add a task..." required maxlength="60">
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>
    <div class="empty" id="empty-state">no tasks yet — add one above</div>

    <div class="footer">
      <span id="task-count">0 tasks</span>
      <span id="clock"></span>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let nextId = 1;

  const form = document.getElementById('task-form');
  const input = document.getElementById('task-input');
  const list = document.getElementById('task-list');
  const emptyState = document.getElementById('empty-state');
  const taskCount = document.getElementById('task-count');
  const clock = document.getElementById('clock');

  function render() {
    list.innerHTML = '';
    emptyState.style.display = tasks.length === 0 ? 'block' : 'none';
    taskCount.textContent = `${tasks.length} task${tasks.length === 1 ? '' : 's'}`;

    tasks.slice().reverse().forEach((task) => {
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <div class="task-left">
          <span class="task-title">${escapeHtml(task.title)}</span>
        </div>
        <div class="task-right">
          <span class="status status-${task.status}"><span class="status-dot"></span>${task.status}</span>
          <button class="delete-btn" aria-label="Delete task" data-id="${task.id}">×</button>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    tasks.push({ id: nextId++, title, status: 'pending' });
    input.value = '';
    render();
  });

  list.addEventListener('click', (e) => {
    if (e.target.classList.contains('delete-btn')) {
      const id = parseInt(e.target.dataset.id, 10);
      tasks = tasks.filter((t) => t.id !== id);
      render();
    }
  });

  // Simulated worker loop — same state machine as worker/worker.js,
  // just running in the browser instead of polling a real API.
  function workerTick() {
    const pending = tasks.find((t) => t.status === 'pending');
    if (pending) {
      pending.status = 'processing';
      render();
      setTimeout(() => {
        pending.status = 'done';
        render();
      }, 1800);
    }
  }
  setInterval(workerTick, 2200);

  function tickClock() {
    clock.textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  setInterval(tickClock, 1000);
  tickClock();

  render();
</script>
</body>
</html>
